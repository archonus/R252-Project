[project]
name = "quantum_transformers"
version = "0.1.0"
description = ""
authors = [
    { name = "Marçal Comajoan Cara", email = "mcomajoancara@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "orbax-checkpoint==0.2.7",
    "importlib_resources",
    "scipy>=1.10.0,<1.13.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "tensorcircuit>=0.11.0,<0.12.0",
    "jax[cuda11-cudnn86]==0.4.13",
    "flax>=0.7.1,<0.8.0",
    "optax>=0.1.7,<0.2.0",
    "ipykernel>=6.25.0,<7.0.0",
    "jupyterlab>=4.2.5,<5.0.0",
    "matplotlib>=3.7.2,<4.0.0",
    "tensorflow-datasets>=4.9.2,<5.0.0",
    "tensorflow>=2.14.0,<3.0.0",
    "ipywidgets>=8.1.0,<9.0.0",
    "tqdm>=4.66.3,<5.0.0",
    "numpy>=1.25.2,<2.0.0",
    "gdown>=4.7.1,<5.0.0",
    "qiskit>=1.4.2,<2.0.0",
    "pylatexenc>=2.10,<3.0.0",
    "tensorflow-text>=2.14.0,<3.0.0",
    "ray[tune]>=2.43.0,<3.0.0",
    "protobuf>=3.20.3,<3.21.0",
    "wandb",
    "dotenv",
]

[tool.uv]
find-links = [
    "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"